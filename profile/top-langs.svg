<svg width="300" height="165" viewBox="0 0 300 165" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId descId">
  <title id="titleId">Most Used Languages</title>
  <desc id="descId">Language distribution chart</desc>

  <defs>
    <clipPath id="bar-clip">
      <rect x="0" y="0" width="256" height="10" rx="5"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" rx="10" width="299" height="164" fill="#0f1115" stroke="#2a2d34" stroke-width="1"/>

  <line x1="22" y1="34" x2="36" y2="34" stroke="#d97757" stroke-width="3" stroke-linecap="round"/>
  <text x="44" y="39" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="16" font-weight="600" fill="#e6e6e6" letter-spacing="0.3">Most Used Languages</text>

  <rect x="22" y="58" width="256" height="10" rx="5" fill="#1c1f26"/>

  <g clip-path="url(#bar-clip)" transform="translate(22, 58)">
    <rect x="0" y="0" width="102.96" height="10" fill="#555555"/>
    <rect x="102.96" y="0" width="83.38" height="10" fill="#A97BFF"/>
    <rect x="186.34" y="0" width="45.29" height="10" fill="#b07219"/>
    <rect x="231.63" y="0" width="17.41" height="10" fill="#ff3e00"/>
    <rect x="249.04" y="0" width="4.28" height="10" fill="#3178c6"/>
    <rect x="253.32" y="0" width="2.68" height="10" fill="#89e051"/>
  </g>

  <g transform="translate(22, 90)" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="11">
    <circle cx="5" cy="6" r="4" fill="#555555"/>
    <text x="14" y="10" fill="#a8b0bc">C</text>
    <text x="130" y="10" fill="#e6e6e6" font-weight="600" text-anchor="end">40.22%</text>

    <g transform="translate(0, 20)">
      <circle cx="5" cy="6" r="4" fill="#A97BFF"/>
      <text x="14" y="10" fill="#a8b0bc">Kotlin</text>
      <text x="130" y="10" fill="#e6e6e6" font-weight="600" text-anchor="end">32.57%</text>
    </g>
    <g transform="translate(0, 40)">
      <circle cx="5" cy="6" r="4" fill="#b07219"/>
      <text x="14" y="10" fill="#a8b0bc">Java</text>
      <text x="130" y="10" fill="#e6e6e6" font-weight="600" text-anchor="end">17.69%</text>
    </g>

    <g transform="translate(133, 0)">
      <circle cx="5" cy="6" r="4" fill="#ff3e00"/>
      <text x="14" y="10" fill="#a8b0bc">Svelte</text>
      <text x="130" y="10" fill="#e6e6e6" font-weight="600" text-anchor="end">6.80%</text>
    </g>
    <g transform="translate(133, 20)">
      <circle cx="5" cy="6" r="4" fill="#3178c6"/>
      <text x="14" y="10" fill="#a8b0bc">TypeScript</text>
      <text x="130" y="10" fill="#e6e6e6" font-weight="600" text-anchor="end">1.67%</text>
    </g>
    <g transform="translate(133, 40)">
      <circle cx="5" cy="6" r="4" fill="#89e051"/>
      <text x="14" y="10" fill="#a8b0bc">Shell</text>
      <text x="130" y="10" fill="#e6e6e6" font-weight="600" text-anchor="end">1.05%</text>
    </g>
  </g>
</svg>
