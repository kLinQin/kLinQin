<svg
  width="340"
  height="220"
  viewBox="0 0 340 220"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">Language stats</title>
  <desc id="descId">Language distribution with percentages and lines of code</desc>
  <style>
    .card-bg { fill: #0f1115; stroke: #2a2d34; stroke-width: 1; }
    .header { font: 600 15px 'Segoe UI', Ubuntu, Sans-Serif; fill: #e6e6e6; letter-spacing: 0.3px; }
    .sub    { font: 400 10px 'Segoe UI', Ubuntu, Sans-Serif; fill: #6b7280; }
    .accent { stroke: #d97757; stroke-width: 3; stroke-linecap: round; }
    .tag    { font: 600 10px 'Segoe UI', Ubuntu, Sans-Serif; fill: #6b7280; letter-spacing: 0.5px; text-transform: uppercase; }
    .val    { font: 700 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #e6e6e6; }
    .label-inbar { font: 600 10px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ffffff; }
    .lang-name { font: 500 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #cbd5e1; }
    .lang-pct  { font: 600 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #e6e6e6; }
    .lang-loc  { font: 400 10px 'Segoe UI', Ubuntu, Sans-Serif; fill: #6b7280; }
    .divider { stroke: #1f2330; stroke-width: 1; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .stagger { opacity: 0; animation: fadeIn 0.5s ease-out forwards; }
    @keyframes growWidth {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }
    .lang-progress { transform-origin: left center; animation: growWidth 0.9s ease-out forwards; }
  </style>

  <rect x="0.5" y="0.5" rx="10" height="219" width="339" class="card-bg"/>

  <!-- Header -->
  <g transform="translate(22, 30)">
    <line x1="0" y1="4" x2="14" y2="4" class="accent"/>
    <text x="22" y="8" class="header">Most Used Languages</text>
    <text x="316" y="8" class="sub" text-anchor="end">Last 12 months</text>
  </g>

  <!-- Summary chips -->
  <g transform="translate(22, 46)">
    <text class="tag">TOTAL LOC</text>
    <text y="16" class="val">248,930</text>
  </g>
  <g transform="translate(150, 46)">
    <text class="tag">LANGUAGES</text>
    <text y="16" class="val">6</text>
  </g>
  <g transform="translate(240, 46)">
    <text class="tag">TOP</text>
    <text y="16" class="val">C · 40.2%</text>
  </g>

  <line x1="22" y1="76" x2="318" y2="76" class="divider"/>

  <!-- Bar background -->
  <g transform="translate(22, 88)">
    <rect x="0" y="0" width="296" height="14" rx="7" fill="#1c1f26"/>
    <mask id="rect-mask">
      <rect x="0" y="0" width="296" height="14" rx="7" fill="white"/>
    </mask>
  </g>

  <!-- Bar segments + labels -->
  <g mask="url(#rect-mask)" transform="translate(22, 88)">
    <rect x="0" y="0" width="119.05" height="14" fill="#555555" class="lang-progress" style="animation-delay: 0ms"/>
    <rect x="119.05" y="0" width="96.41" height="14" fill="#A97BFF" class="lang-progress" style="animation-delay: 80ms"/>
    <rect x="215.46" y="0" width="52.36" height="14" fill="#b07219" class="lang-progress" style="animation-delay: 160ms"/>
    <rect x="267.82" y="0" width="20.13" height="14" fill="#ff3e00" class="lang-progress" style="animation-delay: 240ms"/>
    <rect x="287.95" y="0" width="4.94" height="14" fill="#3178c6" class="lang-progress" style="animation-delay: 320ms"/>
    <rect x="292.89" y="0" width="3.11" height="14" fill="#89e051" class="lang-progress" style="animation-delay: 400ms"/>
  </g>
  <text x="60" y="98" class="label-inbar">C 40.2%</text>
  <text x="167" y="98" class="label-inbar">Kotlin 32.6%</text>

  <!-- Legend -->
  <g transform="translate(22, 118)">
    <g class="stagger" style="animation-delay: 500ms">
      <circle cx="5" cy="6" r="4" fill="#555555"/>
      <text x="14" y="10" class="lang-name">C</text>
      <text x="160" y="10" class="lang-pct" text-anchor="end">40.22%</text>
      <text x="296" y="10" class="lang-loc" text-anchor="end">100,136 lines</text>
    </g>
    <g class="stagger" style="animation-delay: 560ms" transform="translate(0, 20)">
      <circle cx="5" cy="6" r="4" fill="#A97BFF"/>
      <text x="14" y="10" class="lang-name">Kotlin</text>
      <text x="160" y="10" class="lang-pct" text-anchor="end">32.57%</text>
      <text x="296" y="10" class="lang-loc" text-anchor="end">81,059 lines</text>
    </g>
    <g class="stagger" style="animation-delay: 620ms" transform="translate(0, 40)">
      <circle cx="5" cy="6" r="4" fill="#b07219"/>
      <text x="14" y="10" class="lang-name">Java</text>
      <text x="160" y="10" class="lang-pct" text-anchor="end">17.69%</text>
      <text x="296" y="10" class="lang-loc" text-anchor="end">44,035 lines</text>
    </g>
    <g class="stagger" style="animation-delay: 680ms" transform="translate(0, 60)">
      <circle cx="5" cy="6" r="4" fill="#ff3e00"/>
      <text x="14" y="10" class="lang-name">Svelte</text>
      <text x="160" y="10" class="lang-pct" text-anchor="end">6.80%</text>
      <text x="296" y="10" class="lang-loc" text-anchor="end">16,928 lines</text>
    </g>
    <g class="stagger" style="animation-delay: 740ms" transform="translate(0, 80)">
      <circle cx="5" cy="6" r="4" fill="#3178c6"/>
      <text x="14" y="10" class="lang-name">TypeScript</text>
      <text x="160" y="10" class="lang-pct" text-anchor="end">1.67%</text>
      <text x="296" y="10" class="lang-loc" text-anchor="end">4,157 lines</text>
    </g>
    <g class="stagger" style="animation-delay: 800ms" transform="translate(0, 100)">
      <circle cx="5" cy="6" r="4" fill="#89e051"/>
      <text x="14" y="10" class="lang-name">Shell</text>
      <text x="160" y="10" class="lang-pct" text-anchor="end">1.05%</text>
      <text x="296" y="10" class="lang-loc" text-anchor="end">2,615 lines</text>
    </g>
  </g>
</svg>
